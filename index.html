<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Untitled</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">  
  </head>
  <body>
    <script>
      let circleX = 200;
      let circleY = 500;
      let circleSize = 50; //Diameter of circle
      let myFont;
      
      async function setup() {
        createCanvas(800, 600); //canvas 800w by 880h
        background(100, 25, 69); // light grey
        background("#F2B1B7");
        let from = color(218, 165, 32);
        let to = color(72, 61, 139);
        let interA = lerpColor(from, to, 0.33);
        let interB = lerpColor(from, to , 0.66);
        fill(interA);
        ellipse(circleX, circleY, circleSize);
        myFont = await
        loadFont('https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap');
        //colorMode(HSL, 100, 75, 69);
      }
      function draw() {
        //x, y, width, height
        //ellipse(300, 200, 500, 700);
        let str = "lol";
        fill(212, 176, 247);
        strokeWeight(9);
        circle(200, 200, 50);
        strokeWeight(2);
        stroke('yellow');
        //noStroke()
        line(340, 340, 600, 400);
        fill("#155C21");
        rect(340, 400, 50, 75);
        //fill(60, 239, 212);
        noFill();
        triangle(230, 368, 330, 300, 435, 365);
        fill(306,77,57);
        arc(600, 50, 100, 100,radians(90),radians(360));
        fill(50, 30, 25, 80);
        stroke('blue');
        beginShape(TRIANGLE_FAN);
        vertex(50,50);
        vertex(240, 300);
        vertex(625, 754);
        vertex(300, 205);
        endShape(CLOSE);
        textSize(45);
        stroke(245, 123, 93);
        strokeWeight(5);
        textFont(myFont);
        //textStyle(BOLDITALIC);
        textAlign(CENTER, TOP);
        text(str, 500, 450);
        let des = textDescent();
        stroke('red');
        line(500, 400, 500 + des, 450);
        textWeight(100);
        textLeading(90);
        text("cen\nter", 500, 480);
      }
      
    </script>
  </body>
</html>
