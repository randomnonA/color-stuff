<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Untitled</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
  </head>
  <body>
    <script>
      let circleX = 200;
      let circleY = 200;
      let circleSize = 50; //Diameter of circle
      
      function setup() {
        createCanvas(800, 680); //canvas 800w by 880h
        background(100, 25, 69); // light grey
        //colorMode(HSL);
      }
      function draw() {
        //x, y, width, height
        //ellipse(300, 200, 500, 700);
        //ellipse(circleX, circleY, circleSize);'
        circle(200, 200, 50);
        strokeWeight(2);
        stroke('purple');
        line(340, 340, 600, 400);
        fill("#155C21");
        rect(340, 400, 50, 75);
        fill(60, 239, 212);
        triangle(230, 368, 330, 300, 435, 365);
        fill(306,77,57);
        arc(600, 50, 100, 100,radians(90),radians(360));
        fill(50, 30, 25, 80);
        beginShape(TRIANGLE_FAN);
        vertex(50,50);
        vertex(240, 300);
        vertex(625, 754);
        vertex(300, 205);
        endShape(CLOSE);
      }
      
    </script>
  </body>
</html>
